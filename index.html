<script>/* NEXUS AGROEXPERT — socle de données et moteurs. Les calculs (NAE.calc) n'utilisent que les références saisies par l'utilisateur, jamais de valeur par défaut. */
const NAE = {
  version: '1.7.0',
  cultures: ['Maïs', 'Manioc'],
  causes: ['Sécheresse / déficit hydrique','Inondation','Ravageurs','Maladies','Divagation d\'animaux','Incendie','Vent / verse','Autre / indéterminée'],
  stades: ['Semis / levée','Croissance végétative','Floraison / tubérisation','Maturation','Récolte'],
  // Structures de données prévues (stores IndexedDB). Les moteurs futurs s'y brancheront.
  stores: ['missions','producteurs','parcelles','cultures','varietes','observations','zones_endommagees','references_agronomiques','evaluations_economiques'],
  newMission() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const id = 'M' + d.getTime().toString(36).toUpperCase();
    return { id, reference: `NAE-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${id.slice(-4)}`,
      creeLe: d.toISOString(), modifieLe: d.toISOString(), dateConstat: d.toISOString().slice(0,10), agent: '',
      producteur: { nom: '', telephone: '' },
      parcelle: { localite: '', commune: '', superficieHa: '', lat: '', lon: '', precisionM: '' },
      culture: { espece: 'Maïs', variete: '', dateSemis: '', stade: '' },
      observations: { cause: '', atteintePct: '', description: '' },
      zonesEndommagees: [], evaluationEconomique: null };
  },
  validate(m) {
    const e = [];
    if (!m.producteur.nom.trim()) e.push('Le nom du producteur est obligatoire.');
    if (!this.cultures.includes(m.culture.espece)) e.push('Choisissez la culture.');
    const s = m.parcelle.superficieHa; if (s !== '' && !(Number(s) > 0)) e.push('La superficie doit être supérieure à 0.');
    const a = m.observations.atteintePct; if (a !== '' && !(Number(a) >= 0 && Number(a) <= 100)) e.push('L\'atteinte estimée doit être entre 0 et 100 %.');

NAE.geo = {
  proj(pts) { const R = 6371008.8, la = pts.reduce((s, p) => s + p.lat, 0) / pts.length * Math.PI / 180;
    const q = pts.map(p => ({ x: R * p.lon * Math.PI / 180 * Math.cos(la), y: R * p.lat * Math.PI / 180 })); const o = q[0] || { x: 0, y: 0 }; return q.map(p => ({ x: p.x - o.x, y: p.y - o.y })); },
  areaM2(pts) { if (pts.length < 3) return 0; const q = this.proj(pts); let s = 0; for (let i = 0; i < q.length; i++) { const a = q[i], b = q[(i + 1) % q.length]; s += a.x * b.y - b.x * a.y; } return Math.abs(s) / 2; },
  perimetreM(pts) { if (pts.length < 2) return 0; const q = this.proj(pts), n = pts.length > 2 ? q.length : 1; let s = 0; for (let i = 0; i < n; i++) { const a = q[i], b = q[(i + 1) % q.length]; s += Math.hypot(b.x - a.x, b.y - a.y); } return s; },
  valid(p) { return Number.isFinite(p.lat) && Number.isFinite(p.lon) && Math.abs(p.lat) <= 90 && Math.abs(p.lon) <= 180; },
  croise(pts) { if (pts.length < 4) return false; const q = this.proj(pts), n = q.length, o = (a, b, c) => Math.sign((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x));
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { if (j === i + 1 || (i === 0 && j === n - 1)) continue; const a = q[i], b = q[(i + 1) % n], c = q[j], d = q[(j + 1) % n]; if (o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0) return true; } return false; }
};
NAE.grandeurs = ['Rendement de référence', 'Prix de vente unitaire', 'Coût de production', 'Autre'];
NAE.fiabilites = ['Élevée', 'Moyenne', 'Faible', 'À vérifier'];
NAE.validateRef = r => { const e = []; if (!(Number(r.valeur) > 0)) e.push('La valeur doit être supérieure à 0.'); if (!r.unite.trim()) e.push('L\'unité est obligatoire.'); if (!r.source.trim()) e.push('La source est obligatoire.'); if (!r.dateSource) e.push('La date de la source est obligatoire.'); if (!r.fiabilite) e.push('Indiquez la fiabilité.'); return e; };
NAE.calc = {
  norm: u => String(u || '').toLowerCase().replace(/\s+/g, '').replace(/tonnes?/g, 't').replace(/hectares?/g, 'ha'),
  unites(rU, pU) {
    const r = this.norm(rU).split('/'), p = String(pU || '').trim(), i = p.lastIndexOf('/');
    if (r.length !== 2 || !r[0] || r[1] !== 'ha') return { ok: false, erreur: 'Unité de rendement non exploitable : « ' + rU + ' ». Elle doit être de la forme « unité de masse/ha ».' };
    if (i < 1) return { ok: false, erreur: 'Unité de prix non exploitable : « ' + pU + ' ». Elle doit être de la forme « monnaie/unité de masse ».' };
    const masse = this.norm(p.slice(i + 1)), monnaie = p.slice(0, i).trim();
    if (masse !== r[0]) return { ok: false, erreur: 'Unités incohérentes : le rendement est exprimé en « ' + rU + ' » et le prix en « ' + pU + ' ». Le prix doit porter sur la même unité de masse que le rendement ; calcul refusé.' };
    return { ok: true, masse: p.slice(i + 1).trim(), monnaie };
  },
  perteZone(z, rR, rP) {
    const e = [], S = Number(z.surfaceHa), A = z.atteintePct;
    if (!(S > 0)) e.push('Surface touchée manquante ou nulle.');
    if (A === '' || A == null || !(Number(A) >= 0 && Number(A) <= 100)) e.push('Taux d\'atteinte non renseigné (0 à 100 %) : aucun calcul sans ce taux.');
    const chk = (r, g, nom) => { if (!r) { e.push('Aucune référence de ' + nom + ' choisie : aucun calcul.'); return; }
      if (r.grandeur !== g) e.push('La référence choisie pour le ' + nom + ' n\'est pas de type « ' + g + ' ».');
      if (!(Number(r.valeur) > 0)) e.push('La référence de ' + nom + ' a une valeur invalide.');
      if (r.culture !== 'Toutes' && r.culture !== z.culture) e.push('La référence de ' + nom + ' concerne ' + r.culture + ', la zone concerne ' + z.culture + '.'); };
    chk(rR, 'Rendement de référence', 'rendement'); chk(rP, 'Prix de vente unitaire', 'prix');
    let u; if (rR && rP && !e.length) { u = this.unites(rR.unite, rP.unite); if (!u.ok) e.push(u.erreur); }
    if (e.length) return { ok: false, erreurs: e };
    const R = Number(rR.valeur), P = Number(rP.valeur), perte = S * R * Number(A) / 100;
    return { ok: true, surfaceHa: S, rendement: R, atteinte: Number(A), prix: P, perteQte: perte, masse: u.masse, valeur: perte * P, monnaie: u.monnaie };
  },
  snap: r => ({ id: r.id, culture: r.culture, grandeur: r.grandeur, valeur: r.valeur, unite: r.unite, source: r.source, dateSource: r.dateSource, zone: r.zone || '', fiabilite: r.fiabilite, limites: r.limites || '', modifieLe: r.modifieLe || '' }),
  evaluer(m, refs, choix, now) {
    const by = id => refs.find(r => r.id === id), zones = [], non = [];
    (m.zonesEndommagees || []).forEach(z => { const c = choix[z.id] || {}, rR = by(c.rend), rP = by(c.prix), r = this.perteZone(z, rR, rP), b = { zoneId: z.id, nom: z.nom || 'Zone', culture: z.culture };
      if (r.ok) zones.push(Object.assign(b, r, { refRendement: this.snap(rR), refPrix: this.snap(rP), zoneEntree: { surfaceHa: z.surfaceHa, atteintePct: z.atteintePct, culture: z.culture } }));
      else non.push(Object.assign(b, { erreurs: r.erreurs })); });
    const tm = {}, tc = {};
    zones.forEach(o => { const a = tm[o.monnaie] || (tm[o.monnaie] = { monnaie: o.monnaie, valeur: 0, zones: 0 }); a.valeur += o.valeur; a.zones++;
      const k = o.culture + '|' + o.masse, c = tc[k] || (tc[k] = { culture: o.culture, masse: o.masse, perteQte: 0 }); c.perteQte += o.perteQte; });
    return { calculeLe: now || new Date().toISOString(), version: NAE.version, choix, zones, nonCalculees: non, totaux: Object.values(tm), parCulture: Object.values(tc) };
  },
  verifier(m, refs) {
    const ev = m.evaluationEconomique, w = []; if (!ev) return w;
    const by = id => refs.find(r => r.id === id), F = ['valeur', 'unite', 'source', 'dateSource', 'zone', 'fiabilite', 'limites', 'culture'], zs = m.zonesEndommagees || [];
    ev.zones.forEach(o => { [['rendement', o.refRendement], ['prix', o.refPrix]].forEach(([k, s]) => { const c = by(s.id);
        if (!c) w.push(o.nom + ' : la référence de ' + k + ' utilisée a été supprimée du référentiel.');
        else if (F.some(f => String(c[f] ?? '') !== String(s[f] ?? ''))) w.push(o.nom + ' : la référence de ' + k + ' utilisée a été modifiée depuis le calcul.'); });
      const z = zs.find(x => x.id === o.zoneId);
      if (!z) w.push(o.nom + ' : zone supprimée depuis le calcul.');
      else if (String(z.surfaceHa) !== String(o.zoneEntree.surfaceHa) || String(z.atteintePct) !== String(o.zoneEntree.atteintePct) || z.culture !== o.zoneEntree.culture) w.push(o.nom + ' : surface, atteinte ou culture modifiée depuis le calcul.'); });
    const ids = new Set(ev.zones.concat(ev.nonCalculees).map(o => o.zoneId)); zs.forEach(z => { if (!ids.has(z.id)) w.push((z.nom || 'Zone') + ' : zone ajoutée depuis le calcul.'); });
    return w;
  }

const DB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('nexus-agroexpert', 1);
      r.onupgradeneeded = () => { const db = r.result; NAE.stores.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); }); };
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('missions', mode); const out = fn(t.objectStore('missions')); t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); }); },
  all() { return this.tx('readonly', s => s.getAll()); },
  get(id) { return this.tx('readonly', s => s.get(id)); },
  put(m) { m.modifieLe = new Date().toISOString(); return this.tx('readwrite', s => s.put(m)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  async txs(name, mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(name, mode); const out = fn(t.objectStore(name)); t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); }); },
  allRef() { return this.txs('references_agronomiques', 'readonly', s => s.getAll()); },
  getRef(id) { return this.txs('references_agronomiques', 'readonly', s => s.get(id)); },
  putRef(r) { r.modifieLe = new Date().toISOString(); return this.txs('references_agronomiques', 'readwrite', s => s.put(r)); },
  delRef(id) { return this.txs('references_agronomiques', 'readwrite', s => s.delete(id)); },
  /* Import : une seule transaction sur les deux stores, tout ou rien. Conserve modifieLe tel que fourni. */
  async importer(missions, refs) {
    const db = await this.open();
    return new Promise((res, rej) => {
      let t;
      try { t = db.transaction(['missions', 'references_agronomiques'], 'readwrite'); const sm = t.objectStore('missions'), sr = t.objectStore('references_agronomiques'); missions.forEach(m => sm.put(m)); refs.forEach(r => sr.put(r)); }
      catch (e) { try { if (t) t.abort(); } catch (_) {} rej(e); return; }
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Transaction annulée'));
    });
  }
};

/* ===== Étape 8 : sauvegarde et restauration (V1.7.0) ===== */
NAE.backup = {
  APP: 'NEXUS AGROEXPERT', SEUIL: 5 * 1024 * 1024, MAX_FICHIER: 50 * 1024 * 1024,
  O(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); },
  S(v) { return v == null || typeof v === 'object' ? '' : String(v); },
  zones(m) { return Array.isArray(m.zonesEndommagees) ? m.zonesEndommagees.filter(z => this.O(z)) : []; },
  photos(z) { return Array.isArray(z.photos) ? z.photos : []; },
  nbPhotos(ms) { let n = 0, c = 0; ms.forEach(m => this.zones(m).forEach(z => this.photos(z).forEach(p => { n++; c += String(p).length; }))); return { n, chars: c }; },
  sansPhotos(m) { return Object.assign({}, m, { zonesEndommagees: (Array.isArray(m.zonesEndommagees) ? m.zonesEndommagees : []).map(z => this.O(z) ? Object.assign({}, z, { photos: [] }) : z) }); },
  fichierToutes(ms, refs, sans) {
    const o = { application: this.APP, version: NAE.version, exporteLe: new Date().toISOString() };
    if (sans) o.sansPhotos = true;
    o.missions = sans ? ms.map(m => this.sansPhotos(m)) : ms; o.references = refs; return o;
  },
  fichierMission(m, sans) { return sans ? Object.assign(this.sansPhotos(m), { sansPhotos: true }) : m; },
  json(o) { return JSON.stringify(o, null, 2); },

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
function toast(t) { const e = $('#toast'); e.textContent = t; e.className = 'on'; setTimeout(() => e.className = '', 2600); }
function opts(list, sel, blank) { return (blank ? '<option value="">—</option>' : '') + list.map(x => `<option${x === sel ? ' selected' : ''}>${esc(x)}</option>`).join(''); }
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
function setNav(p) {
  const items = [['#/','🏠','Accueil'],['#/nouvelle','➕','Mission'],['#/missions','📋','Missions'],['#/referentiel','📚','Référentiel'],['#/parametres','⚙️','Paramètres']];
  $('#nav').innerHTML = items.map(([h,i,t]) => `<a href="${h}" class="${p === h ? 'on' : ''}"><span>${i}</span>${t}</a>`).join('');
}
function bar(t) { return `<div class="bar">${esc(t)}</div>`; }

function home() {
  const online = navigator.onLine;
  app.innerHTML = `<div class="hero"><div class="top"><img src="${LOGO}" alt="Logo L'Expert Nexus Agro"><b>NEXUS AGROEXPERT</b></div>
  <img class="photo" src="${HERO}" alt="Parcelle agricole de maïs et de manioc"></div>
  <div class="pad"><h1 class="tl">L'intelligence au service de l'expertise agricole.</h1><p class="ds">Diagnostiquer, mesurer et évaluer les dommages agricoles avec précision.</p><a class="btn" href="#/nouvelle">Commencer une mission</a><a class="btn sec" href="#/missions">Mes missions</a><a class="btn sec" href="#/tableau">Tableau de bord</a>
  <div class="off"><span class="dot ${online ? 'ok' : ''}"></span><span>Fonctionne hors connexion — données enregistrées sur cet appareil</span></div></div>`;
}

async function list() {
  const ms = (await DB.all()).sort((a, b) => b.modifieLe.localeCompare(a.modifieLe));
  app.innerHTML = bar('Mes missions') + `<div class="pad">${ms.length ? ms.map(m => `<a class="card" href="#/mission/${m.id}"><b>${esc(m.producteur.nom) || 'Producteur non renseigné'}</b><br>
    <span class="tag">${esc(m.culture.espece)}</span><span class="tag">${esc(m.reference)}</span><div class="muted">${esc(m.parcelle.localite || 'Localité non renseignée')} · ${esc(m.dateConstat)}</div></a>`).join('')
    : '<p class="muted">Aucune mission enregistrée.</p>'}<a class="btn" href="#/nouvelle">Nouvelle mission</a></div>`;
}

async function view(id) {
  const m = await DB.get(id); if (!m) { toast('Mission introuvable'); location.hash = '#/missions'; return; }
  const r = (k, v) => `<dt>${k}</dt><dd>${esc(v) || '—'}</dd>`;
  app.innerHTML = bar(m.reference) + `<div class="pad"><h2>Producteur</h2><dl>${r('Nom', m.producteur.nom)}${r('Téléphone', m.producteur.telephone)}${r('Agent', m.agent)}${r('Date du constat', m.dateConstat)}</dl>
  <h2>Parcelle</h2><dl>${r('Localité', m.parcelle.localite)}${r('Commune', m.parcelle.commune)}${r('Superficie (ha)', m.parcelle.superficieHa)}${r('GPS', m.parcelle.lat !== '' ? m.parcelle.lat + ', ' + m.parcelle.lon + ' (±' + m.parcelle.precisionM + ' m)' : '')}${r('Contour relevé', (m.parcelle.contour || []).length ? m.parcelle.contour.length + ' point(s)' : '')}${r('Surface calculée (ha)', m.parcelle.surfaceCalculeeHa)}${r('Périmètre (m)', m.parcelle.perimetreM)}</dl>
  <h2>Culture</h2><dl>${r('Culture', m.culture.espece)}${r('Variété', m.culture.variete)}${r('Date de semis', m.culture.dateSemis)}${r('Stade', m.culture.stade)}</dl>
  <h2>Observations</h2><dl>${r('Cause apparente', m.observations.cause)}${r('Atteinte estimée (%)', m.observations.atteintePct)}${r('Description', m.observations.description)}</dl>
  <h2>Zones endommagées (${(m.zonesEndommagees || []).length})</h2>${(m.zonesEndommagees || []).map(z => `<div class="card"><b>${esc(z.nom || 'Zone')}</b><br><span class="tag">${esc(z.culture)}</span><span class="tag">${esc(z.cause || 'cause non précisée')}</span><div class="muted">${esc(z.surfaceHa)} ha · atteinte ${esc(z.atteintePct) || '?'} %${z.stade ? ' · ' + esc(z.stade) : ''}${z.lat !== '' ? ' · GPS ' + esc(z.lat) + ', ' + esc(z.lon) : ''}</div>${z.observation ? '<div>' + esc(z.observation) + '</div>' : ''}<div>${(z.photos || []).map(p => `<img class="ph" src="${p}" alt="Photo de terrain">`).join('')}</div></div>`).join('') || '<p class="muted">Aucune zone enregistrée.</p>'}${(m.zonesEndommagees || []).length ? '<div class="muted">Surface totale des zones : ' + (m.zonesEndommagees.reduce((s, z) => s + Number(z.surfaceHa || 0), 0)).toFixed(4) + ' ha</div>' : ''}
  <div id="evsum"></div><a class="btn" href="#/pertes/${m.id}">${m.evaluationEconomique ? 'Voir / recalculer les pertes' : 'Calculer les pertes'}</a><a class="btn sec" href="#/rapport/${m.id}">Rapport de mission</a><a class="btn sec" href="#/edit/${m.id}">Modifier</a><div class="muted" id="exinfo"></div><button class="btn sec" id="ex">Exporter cette mission (JSON)</button>${NAE.backup.nbPhotos([m]).n ? '<button class="btn sec" id="exnp">Exporter sans les photos</button>' : ''}<button class="btn warn" id="del">Supprimer</button></div>`;
  { const B = NAE.backup, est = B.estimer(sans => B.fichierMission(m, sans), [m]); $('#exinfo').innerHTML = B.info(est);
    $('#ex').onclick = () => download(m.reference + '.json', B.json(B.fichierMission(m, false)));
    if (est.photos) $('#exnp').onclick = () => download(m.reference + '-sans-photos.json', B.json(B.fichierMission(m, true))); }
  if (m.evaluationEconomique) $('#evsum').innerHTML = '<h2>Évaluation des pertes</h2>' + NAE.ui.result(m.evaluationEconomique, NAE.calc.verifier(m, await DB.allRef()));
  $('#del').onclick = async () => { if (confirm('Supprimer définitivement cette mission ? Cette action est irréversible.')) { await DB.del(m.id); toast('Mission supprimée'); location.hash = '#/missions'; } };
}

async function form(id) {
  const m = id ? await DB.get(id) : NAE.newMission();
  if (!m) { location.hash = '#/missions'; return; }
  const f = (n, l, v, t = 'text', x = '') => `<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
  app.innerHTML = bar(id ? 'Modifier la mission' : 'Nouvelle mission') + `<form class="pad" id="f" novalidate>
  <div class="row">${f('dateConstat','Date du constat',m.dateConstat,'date')}${f('agent','Agent',m.agent)}</div>
  <h2>Producteur</h2>${f('nom','Nom du producteur *',m.producteur.nom,'text','required')}${f('telephone','Téléphone',m.producteur.telephone,'tel')}
  <h2>Parcelle</h2><div class="row">${f('localite','Village / localité',m.parcelle.localite)}${f('commune','Commune',m.parcelle.commune)}</div>
  ${f('superficieHa','Superficie (ha)',m.parcelle.superficieHa,'number','step="any" min="0" inputmode="decimal"')}
  <div class="row">${f('lat','Latitude',m.parcelle.lat,'number','step="any"')}${f('lon','Longitude',m.parcelle.lon,'number','step="any"')}</div>
  <input type="hidden" name="precisionM" value="${esc(m.parcelle.precisionM)}">
  <button type="button" class="btn sec" id="gps">📍 Capturer la position GPS</button><div class="muted" id="gpsmsg"></div>
  <h2>Contour de la parcelle</h2><p class="muted">Marchez le long de la limite et ajoutez votre position à chaque angle (3 points minimum). Plus la précision indiquée est faible, mieux c'est.</p>
  <div id="cn"></div><button type="button" class="btn sec" id="addp">📍 Ajouter ma position comme point</button>
  <div class="row"><label>Latitude du point<input id="mlat" type="number" step="any" inputmode="decimal"></label><label>Longitude du point<input id="mlon" type="number" step="any" inputmode="decimal"></label></div>
  <button type="button" class="btn sec sm" id="addm">Ajouter ce point saisi</button><button type="button" class="btn sec sm" id="undo">Retirer le dernier</button><button type="button" class="btn sec sm" id="clr">Tout effacer</button>
  <button type="button" class="btn" id="usearea">Utiliser la surface calculée</button>
  <h2>Culture</h2><label>Culture *<select name="espece">${opts(NAE.cultures, m.culture.espece)}</select></label>
  ${f('variete','Variété',m.culture.variete)}<div class="row">${f('dateSemis','Date de semis',m.culture.dateSemis,'date')}<label>Stade<select name="stade">${opts(NAE.stades, m.culture.stade, 1)}</select></label></div>
  <h2>Zones endommagées</h2><div id="zn"></div><div id="zed"></div><button type="button" class="btn sec" id="addz">➕ Ajouter une zone endommagée</button>
  <h2>Observations</h2><label>Cause apparente<select name="cause">${opts(NAE.causes, m.observations.cause, 1)}</select></label>
  ${f('atteintePct','Atteinte estimée à vue (%)',m.observations.atteintePct,'number','min="0" max="100" step="any" inputmode="decimal"')}
  <label>Description<textarea name="description" rows="5">${esc(m.observations.description)}</textarea></label>
  <div id="err" style="color:var(--r);font-size:.9rem"></div><button class="btn" type="submit">Enregistrer</button><a class="btn sec" href="${id ? '#/mission/' + id : '#/'}">Annuler</a></form>`;
  $('#gps').onclick = () => {
    const g = $('#gpsmsg'); if (!navigator.geolocation) { g.textContent = 'GPS indisponible sur cet appareil.'; return; }
    g.textContent = 'Recherche de position…';
    navigator.geolocation.getCurrentPosition(p => { const F = $('#f'); F.lat.value = p.coords.latitude.toFixed(6); F.lon.value = p.coords.longitude.toFixed(6); F.precisionM.value = Math.round(p.coords.accuracy); g.textContent = `Position capturée (±${Math.round(p.coords.accuracy)} m).`; },
      e => g.textContent = 'Position non obtenue : ' + e.message, { enableHighAccuracy: true, timeout: 20000 });
  };
  let pts = (m.parcelle.contour || []).slice();
  const rc = () => { const g = NAE.geo, n = pts.length, A = g.areaM2(pts), P = g.perimetreM(pts); let svg = '';
    if (n >= 2) { const q = g.proj(pts), xs = q.map(p => p.x), ys = q.map(p => p.y), x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0 || 1, h = Math.max(...ys) - y0 || 1, s = Math.min(260 / w, 160 / h);
      const c = q.map(p => [(20 + (p.x - x0) * s).toFixed(1), (180 - (p.y - y0) * s).toFixed(1)]);
      svg = '<svg viewBox="0 0 300 200" width="100%" style="background:#fff;border-radius:12px;box-shadow:inset 0 3px 5px rgba(0,0,0,.12)"><polygon points="' + c.map(p => p.join(',')).join(' ') + '" fill="rgba(46,125,50,.25)" stroke="#1b5e20" stroke-width="2"/>' + c.map((p, i) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5" fill="#f9a825"/><text x="' + (+p[0] + 7) + '" y="' + (+p[1] - 7) + '" font-size="11">' + (i + 1) + '</text>').join('') + '</svg>'; }
    $('#cn').innerHTML = svg + '<div class="muted" style="margin:6px 0">' + n + ' point(s)' + (n >= 3 ? ' · surface ' + (A / 10000).toFixed(4) + ' ha (' + Math.round(A) + ' m²) · périmètre ' + Math.round(P) + ' m' : ' · il faut au moins 3 points pour calculer la surface') + '</div>'

    try { await DB.put(m); toast('Mission enregistrée'); location.hash = '#/mission/' + m.id; } catch (e) { $('#err').textContent = 'Échec de l\'enregistrement : ' + e.message; }
  };
}

/* ===== Interface d'import (étape 8) ===== */
function importErreur(msg) {
  app.innerHTML = bar('Import impossible') + `<div class="pad"><div class="card" style="border-left:5px solid var(--r)"><b style="color:var(--r)">Ce fichier ne peut pas être importé</b><div style="margin-top:6px" id="imperr">${esc(msg)}</div></div><p class="muted">Aucune donnée n'a été modifiée.</p><button class="btn" id="bk">Retour aux paramètres</button></div>`;
  $('#bk').onclick = () => settings(); window.scrollTo(0, 0);
}
async function importer(file) {
  const B = NAE.backup;
  try {
    if (file.size > B.MAX_FICHIER) return importErreur('Le fichier est trop volumineux (plus de 50 Mo) pour être une sauvegarde NEXUS AGROEXPERT.');
    let txt; try { txt = await file.text(); } catch (e) { return importErreur('Le fichier n\'a pas pu être lu : ' + e.message); }
    const p = B.parse(txt); if (!p.ok) return importErreur(p.erreur);
    const em = await DB.all(), er = await DB.allRef();
    importResume(file.name, p, B.analyser(p, em, er), em, er);
  } catch (e) { importErreur('Erreur inattendue pendant l\'analyse du fichier : ' + e.message + '. Aucune donnée n\'a été modifiée.'); }
}
function importRefuses(plan) {
  const L = (t, a) => a.map(x => `<div class="card"><b>${t} : ${esc(x.label)}</b><div class="muted">${x.raisons.map(esc).join(' ; ')}</div></div>`).join('');
  return L('Mission refusée', plan.refM) + L('Référence refusée', plan.refR);
}
function importResume(nom, p, plan, em, er, S) {

  const cm = plan.confM.map((x, i) => `<div class="card"><b>${esc(x.mission.reference)}</b> <span class="tag">${esc(x.mission.culture.espece)}</span><div class="muted">${esc(x.mission.producteur.nom || 'Producteur non renseigné')}</div>
    <div class="muted">Sur l'appareil : modifiée le ${esc(dfmt(x.exist.modifieLe))}<br>Dans le fichier : modifiée le ${esc(dfmt(x.mission.modifieLe))}</div>

      : (x.ph.incT === 0 && x.ph.exT > 0 ? `<div class="wr">⚠ Le fichier ne contient aucune photo, alors que cette mission en a ${x.ph.exT} sur l'appareil. Aucune zone ne correspond : ces photos seraient perdues en cas de remplacement.</div>` : '')}</div>`).join('');
  const cr = plan.confR.map((x, i) => `<div class="card"><b>${esc(x.ref.grandeur)}</b> <span class="tag">${esc(x.ref.culture)}</span><div class="muted">Sur l'appareil : ${esc(x.exist.valeur)} ${esc(x.exist.unite)} · ${esc(x.exist.source)} (${esc(dfmt(x.exist.modifieLe))})<br>Dans le fichier : ${esc(x.ref.valeur)} ${esc(x.ref.unite)} · ${esc(x.ref.source)} (${esc(dfmt(x.ref.modifieLe))})</div>
    <label class="rd"><input type="radio" name="cr${i}" value="0" ${S.r[i] ? '' : 'checked'}> Ignorer (garder la version de l'appareil)</label>
    <label class="rd"><input type="radio" name="cr${i}" value="1" ${S.r[i] ? 'checked' : ''}> Remplacer par la version du fichier</label></div>`).join('');

  app.innerHTML = bar('Résumé de l\'import') + `<div class="pad" id="imb"><div class="muted">Fichier : ${esc(nom)}<br>Type : ${kinds[p.kind]}${p.meta.version ? ' · version ' + esc(p.meta.version) : ''}${p.meta.exporteLe ? ' · exporté le ' + esc(dfmt(p.meta.exporteLe)) : ''}</div>
  ${p.meta.sansPhotos ? '<div class="wr">Cette sauvegarde a été exportée sans les photos.</div>' : ''}${B.plusRecente(p.meta.version) ? '<div class="wr">Cette sauvegarde vient d\'une version plus récente de l\'application (' + esc(p.meta.version) + ') : les champs inconnus sont conservés sans être utilisés.</div>' : ''}

  ${plan.confM.length ? '<h2>Missions en conflit</h2><p class="muted">Ces missions existent déjà sur l\'appareil. Par défaut, elles sont ignorées.</p><button class="btn sec sm" id="m0">Tout ignorer</button><button class="btn sec sm" id="m1">Tout remplacer</button>' + cm : ''}

  ${plan.confR.length ? '<h2>Références en conflit</h2><p class="muted">Ces références existent déjà. Par défaut, elles sont ignorées.</p>' + cr : ''}
  ${nbRef ? '<h2>Éléments refusés (' + nbRef + ')</h2><p class="muted">Ils ne seront pas importés.</p>' + importRefuses(plan) : ''}
  ${notes.length ? `<details><summary>Éléments complétés ou corrigés (${notes.length})</summary>${notes.map(x => `<div class="muted"><b>${esc(x.label)}</b> : ${x.notes.map(esc).join(' ; ')}</div>`).join('')}</details>` : ''}
  <div id="imp-act"></div></div>`;
  const maj = () => {
    const nR = Object.values(S.m).filter(Boolean).length + Object.values(S.r).filter(Boolean).length, nA = plan.nouvM.length + plan.nouvR.length;

    else if (t.dataset.g != null) S.g[+t.dataset.g] = t.checked;

  maj(); window.scrollTo(0, 0);
}
function importConfirmer(nom, p, plan, em, er, S) {
  const B = NAE.backup, repM = plan.confM.filter((x, i) => S.m[i]), repR = plan.confR.filter((x, i) => S.r[i]);

  app.innerHTML = bar('Confirmer le remplacement') + `<div class="pad"><div class="card" style="border-left:5px solid var(--r)"><b style="color:var(--r)">⚠ Remplacement définitif</b><div style="margin-top:6px">Vous allez remplacer <b>${repM.length}</b> mission(s) et <b>${repR.length}</b> référence(s) de cet appareil par celles du fichier. Les versions actuelles seront écrasées et ne pourront pas être restaurées.</div></div>
  ${repM.map(x => `<div class="muted">• Mission ${esc(x.mission.reference)}${ph(x)}</div>`).join('')}${repR.map(x => `<div class="muted">• Référence ${esc(x.ref.grandeur)} ${esc(x.ref.culture)}</div>`).join('')}
  <p class="muted">Conseil : sauvegardez d'abord l'état actuel de l'appareil.</p>
  <button class="btn sec" id="sv">Sauvegarder d'abord l'appareil (JSON)</button><button class="btn warn" id="ok">Confirmer le remplacement et importer</button><button class="btn sec" id="rt">Retour</button></div>`;
  $('#sv').onclick = () => download('nexus-agroexpert-avant-import-' + new Date().toISOString().slice(0, 10) + '.json', B.json(B.fichierToutes(em, er, false)));
  $('#ok').onclick = () => importAppliquer(plan, S);
  $('#rt').onclick = () => importResume(nom, p, plan, em, er, S); window.scrollTo(0, 0);
}
async function importAppliquer(plan, S) {
  const B = NAE.backup, pm = [], pr = [], st = { addM: plan.nouvM.length, repM: 0, ignM: plan.idemM.length, addR: plan.nouvR.length, repR: 0, ignR: plan.idemR.length, photos: 0 };
  plan.nouvM.forEach(x => pm.push(x.mission));
  plan.confM.forEach((x, i) => { if (S.m[i]) { const g = x.ph.keep > 0 && S.g[i] !== false; pm.push(g ? B.fusionnerPhotos(x.mission, x.exist) : x.mission); st.repM++; if (g) st.photos += x.ph.keep; } else st.ignM++; });
  plan.nouvR.forEach(x => pr.push(x.ref));
  plan.confR.forEach((x, i) => { if (S.r[i]) { pr.push(x.ref); st.repR++; } else st.ignR++; });
  try { await DB.importer(pm, pr); }
  catch (e) { return importErreur('Échec de l\'écriture dans la base : ' + e.message + '. L\'opération a été annulée : rien n\'a été modifié.'); }
  const c = (a, r, i, f) => `<div class="card"><b>${a}</b> ajoutée(s) · <b>${r}</b> remplacée(s) · <b>${i}</b> ignorée(s)${f ? ' · <b>' + f + '</b> refusée(s)' : ' · <b>0</b> refusée(s)'}</div>`;
  app.innerHTML = bar('Import terminé') + `<div class="pad"><h2>Missions</h2>${c(st.addM, st.repM, st.ignM, plan.refM.length)}<h2>Références</h2>${c(st.addR, st.repR, st.ignR, plan.refR.length)}
  ${st.photos ? `<p class="muted">${st.photos} photo(s) existante(s) conservée(s).</p>` : ''}${plan.idemM.length + plan.idemR.length ? `<p class="muted">Les éléments « ignorés » comprennent ${plan.idemM.length + plan.idemR.length} élément(s) déjà identique(s) sur l'appareil.</p>` : ''}
  ${plan.refM.length + plan.refR.length ? '<h2>Refusés</h2>' + importRefuses(plan) : ''}<a class="btn" href="#/missions">Voir les missions</a><button class="btn sec" id="fin">Retour aux paramètres</button></div>`;
  $('#fin').onclick = () => settings(); toast('Import terminé'); window.scrollTo(0, 0);
}
async function settings() {
  const B = NAE.backup, ms = await DB.all(), refs = await DB.allRef(), n = ms.length;
  const est = B.estimer(sans => B.fichierToutes(ms, refs, sans), ms);
  app.innerHTML = bar('Paramètres') + `<div class="pad"><h2>Données</h2><p class="muted">${n} mission(s) enregistrée(s) sur cet appareil.</p>
  <h2>Sauvegarde et restauration</h2><p class="muted">Le fichier de sauvegarde contient vos missions et votre référentiel (${refs.length} référence(s)).</p><div class="muted" id="bkinfo">${B.info(est)}</div>
  <button class="btn" id="exall">Exporter toutes les missions (JSON)</button>${est.photos ? '<button class="btn sec" id="exallnp">Exporter sans les photos</button>' : ''}
  <button class="btn sec" id="imp">Importer une sauvegarde (JSON)</button><input type="file" id="impf" accept=".json,application/json,text/plain" hidden>

  const dl = sans => download('nexus-agroexpert-missions-' + new Date().toISOString().slice(0, 10) + (sans ? '-sans-photos' : '') + '.json', B.json(B.fichierToutes(ms, refs, sans)));

NAE.ui = {
  f: n => Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 }),
  ref(t, s) { return `<div class="muted"><b>${t}</b> : ${this.f(s.valeur)} ${esc(s.unite)} · source : ${esc(s.source)} (${esc(s.dateSource)}) · fiabilité : ${esc(s.fiabilite)}${s.zone ? ' · zone : ' + esc(s.zone) : ''}${s.limites ? '<br>Limites : ' + esc(s.limites) : ''}</div>`; },
  result(ev, warns) {
    const f = this.f, d = new Date(ev.calculeLe).toLocaleString('fr-FR');
    return (warns.length ? `<div class="card" style="border-left:5px solid var(--r)"><b style="color:var(--r)">⚠ Le calcul n'est plus à jour</b><br>${warns.map(esc).join('<br>')}<div class="muted">Le résultat ci-dessous reste celui du ${d}. Utilisez « Recalculer » pour l'actualiser.</div></div>` : '')
      + `<div class="muted">Calcul du ${d} · version ${esc(ev.version)}</div>`
      + ev.zones.map(o => `<div class="card"><b>${esc(o.nom)}</b> <span class="tag">${esc(o.culture)}</span>
        <div class="muted">① Perte physique = surface × rendement × atteinte<br>= ${f(o.surfaceHa)} ha × ${f(o.rendement)} ${esc(o.refRendement.unite)} × ${f(o.atteinte)} % = <b>${f(o.perteQte)} ${esc(o.masse)}</b></div>
        <div class="muted">② Valeur de la perte = perte physique × prix<br>= ${f(o.perteQte)} ${esc(o.masse)} × ${f(o.prix)} ${esc(o.refPrix.unite)} = <b>${f(o.valeur)} ${esc(o.monnaie)}</b></div>
        <div style="margin-top:8px"><b>Hypothèses</b></div>${this.ref('Rendement', o.refRendement)}${this.ref('Prix', o.refPrix)}</div>`).join('')
      + ev.nonCalculees.map(o => `<div class="card"><b>${esc(o.nom)}</b> <span class="tag">non calculée</span><div class="muted">${o.erreurs.map(esc).join('<br>')}</div></div>`).join('')
      + (ev.totaux.length ? `<div class="card"><b>Total de la mission</b>${ev.totaux.map(t => `<div style="font-size:1.1rem"><b>${f(t.valeur)} ${esc(t.monnaie)}</b> <span class="muted">(${t.zones} zone(s))</span></div>`).join('')}${ev.parCulture.map(t => `<div class="muted">Perte physique ${esc(t.culture)} : ${f(t.perteQte)} ${esc(t.masse)}</div>`).join('')}${ev.nonCalculees.length ? `<div class="muted">Total partiel : ${ev.nonCalculees.length} zone(s) non calculée(s).</div>` : ''}</div>` : '')
      + '<p class="muted">Estimation technique fondée sur les références saisies par l\'agent. Ce n\'est pas une décision juridique.</p>';
  }
};
async function pertes(id) {
  const m = await DB.get(id); if (!m) { toast('Mission introuvable'); location.hash = '#/missions'; return; }
  const refs = await DB.allRef(), zs = m.zonesEndommagees || [], ev = m.evaluationEconomique, ch = (ev && ev.choix) || {};
  const lab = r => `${r.valeur} ${r.unite} — ${r.source} (${r.dateSource}) · fiabilité ${r.fiabilite}${r.zone ? ' · ' + r.zone : ''}`;
  const sel = (z, k, g) => { const L = refs.filter(r => r.grandeur === g && (r.culture === 'Toutes' || r.culture === z.culture));
    return `<label>${k === 'rend' ? 'Référence de rendement' : 'Référence de prix'}<select data-z="${esc(z.id)}" data-k="${k}"><option value="">— aucune (pas de calcul) —</option>${L.map(r => `<option value="${esc(r.id)}"${(ch[z.id] || {})[k] === r.id ? ' selected' : ''}>${esc(lab(r))}</option>`).join('')}</select></label>${L.length ? '' : `<div class="muted">Aucune référence « ${g} » pour ${esc(z.culture)} : ajoutez-la dans le <a href="#/referentiel">Référentiel</a>.</div>`}`; };
  app.innerHTML = bar('Calcul des pertes · ' + m.reference) + '<div class="pad">' + (zs.length
    ? `<p class="muted">Pour chaque zone, choisissez vous-même la référence de rendement et la référence de prix. Sans référence, aucune valeur n'est calculée.</p>`
      + zs.map(z => `<div class="card"><b>${esc(z.nom || 'Zone')}</b> <span class="tag">${esc(z.culture)}</span><div class="muted">${esc(z.surfaceHa)} ha · atteinte ${z.atteintePct === '' ? 'non renseignée' : esc(z.atteintePct) + ' %'}</div>${sel(z, 'rend', 'Rendement de référence')}${sel(z, 'prix', 'Prix de vente unitaire')}</div>`).join('')
      + `<button class="btn" id="calc">${ev ? 'Recalculer et enregistrer' : 'Calculer et enregistrer'}</button>`
    : `<p>Cette mission n'a aucune zone endommagée à évaluer.</p><a class="btn" href="#/edit/${m.id}">Ajouter une zone</a>`)
    + (ev ? '<h2>Dernier calcul enregistré</h2>' + NAE.ui.result(ev, NAE.calc.verifier(m, refs)) : '') + `<a class="btn sec" href="#/mission/${m.id}">Retour à la mission</a></div>`;
  if (zs.length) $('#calc').onclick = async () => { const c = {};
    app.querySelectorAll('select[data-z]').forEach(s => { (c[s.dataset.z] = c[s.dataset.z] || {})[s.dataset.k] = s.value; });
    try { m.evaluationEconomique = NAE.calc.evaluer(m, await DB.allRef(), c); await DB.put(m); toast('Calcul enregistré'); await pertes(id); window.scrollTo(0, 0); } catch (e) { toast('Échec : ' + e.message); } };
}

NAE.ui.contour = pts => { if (pts.length < 3) return ''; const q = NAE.geo.proj(pts), xs = q.map(p => p.x), ys = q.map(p => p.y), x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0 || 1, h = Math.max(...ys) - y0 || 1, s = Math.min(260 / w, 160 / h), c = q.map(p => [(20 + (p.x - x0) * s).toFixed(1), (180 - (p.y - y0) * s).toFixed(1)]);
  return `<svg viewBox="0 0 300 200" width="100%" style="max-width:420px;background:#fff;border:1px solid #bbb;border-radius:6px"><polygon points="${c.map(p => p.join(',')).join(' ')}" fill="rgba(46,125,50,.25)" stroke="#1b5e20" stroke-width="2"/>${c.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#1b5e20"/><text x="${+p[0] + 6}" y="${+p[1] - 6}" font-size="11" fill="#1c2b1e">${i + 1}</text>`).join('')}<text x="290" y="16" font-size="11" text-anchor="end" fill="#1c2b1e">N ↑</text></svg>`; };
async function rapport(id) {
  const m = await DB.get(id); if (!m) { toast('Mission introuvable'); location.hash = '#/missions'; return; }
  const refs = await DB.allRef(), p = m.parcelle || {}, c = m.culture || {}, o = m.observations || {}, zs = m.zonesEndommagees || [], ev = m.evaluationEconomique, pr = m.producteur || {};
  const r = (k, v) => `<dt>${k}</dt><dd>${esc(v) || '—'}</dd>`, T = t => `<span class="tag">${t}</span>`, gps = (la, lo, pc) => la !== '' && la != null ? `${esc(la)}, ${esc(lo)}${pc !== '' && pc != null ? ' (±' + esc(pc) + ' m)' : ''}` : '';
  app.innerHTML = `<div class="bar noprint">Rapport · ${esc(m.reference)}</div><div class="pad noprint"><button class="btn" id="prt">Imprimer / Enregistrer en PDF</button></div><div class="rp">
  <img class="lg" src="${LOGO}" alt="Logo L'Expert Nexus Agro"><h1>Rapport de constat agricole</h1><p class="muted" style="text-align:center">NEXUS AGROEXPERT · édité le ${new Date().toLocaleDateString('fr-FR')}</p>
  <h2>1. Identification de la mission</h2><dl>${r('Référence', m.reference)}${r('Date du constat', m.dateConstat)}${r('Agent', m.agent)}</dl>

  <p class="muted">Mesures GPS de téléphone : elles ne constituent pas un bornage cadastral. Schéma sans échelle.</p>
  <h2>4. Culture et observations ${T('Faits observés')}</h2><dl>${r('Culture', c.espece)}${r('Variété', c.variete)}${r('Date de semis', c.dateSemis)}${r('Stade', c.stade)}${r('Cause apparente', o.cause)}${r('Description', o.description)}${r('Atteinte estimée à vue (%), estimation', o.atteintePct)}</dl>

  <div class="pad noprint"><a class="btn sec" href="#/mission/${m.id}">Retour à la mission</a></div>`;

NAE.stats = {
  NR: 'Non renseignée',
  tally(items, key) { const t = {}; items.forEach(x => { const k = key(x) || this.NR; t[k] = (t[k] || 0) + 1; }); return Object.entries(t).map(([label, n]) => ({ label, n })); },
  tri(a) { return a.sort((x, y) => (x.label === this.NR) - (y.label === this.NR) || y.n - x.n || x.label.localeCompare(y.label)); },
  mois(m) { const d = [m.dateConstat, m.creeLe].find(v => /^\d{4}-(0[1-9]|1[0-2])/.test(String(v || ''))); return d ? String(d).slice(0, 7) : ''; },
  calc(ms) { return { total: ms.length, parCulture: this.tri(this.tally(ms, m => m.culture && m.culture.espece)), parCause: this.tri(this.tally(ms, m => m.observations && m.observations.cause)),
    parMois: this.tally(ms, m => this.mois(m)).sort((x, y) => (x.label === this.NR) - (y.label === this.NR) || x.label.localeCompare(y.label)) }; }
};
async function tableau() {

  const blk = (t, L, fmt) => `<h2>${t}</h2>${L.map(x => `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:.9rem"><span>${esc(fmt ? fmt(x.label) : x.label)}</span><b>${x.n} <span class="muted">(${Math.round(x.n * 100 / s.total)} %)</span></b></div><div style="background:#e8f5e9;border-radius:8px;height:14px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.15)"><div class="bw" style="width:${x.n * 100 / s.total}%;height:100%;background:linear-gradient(180deg,#4caf50,#1b5e20)"></div></div></div>`).join('')}`;
  const mf = l => /^\d{4}-\d{2}$/.test(l) ? new Date(+l.slice(0, 4), +l.slice(5) - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) : l;
  app.innerHTML = bar('Tableau de bord') + '<div class="pad">' + (s.total
    ? `<div class="card"><span class="muted">Missions enregistrées</span><div style="font-size:2rem;font-weight:800;color:var(--g)">${s.total}</div></div>` + blk('Par culture', s.parCulture) + blk('Par cause apparente', s.parCause) + blk('Par mois du constat', s.parMois, mf)
    : '<p>Aucune mission enregistrée : le tableau de bord se remplit avec vos constats.</p><a class="btn" href="#/nouvelle">Commencer une mission</a>')
    + '<a class="btn sec" href="#/">Retour à l\'accueil</a></div>';
}

let refFilter = 'Toutes';

  <a class="btn" href="#/ref/nouvelle">Ajouter une référence</a>${all.length ? '<button class="btn sec" id="rex">Exporter le référentiel (JSON)</button>' : ''}</div>`;

}

async function route() {
  const h = location.hash || '#/', [, a, id] = h.split('/');
  setNav(['#/', '#/nouvelle', '#/missions', '#/referentiel', '#/parametres'].includes(h) ? h : h.startsWith('#/mission/') || h.startsWith('#/edit/') || h.startsWith('#/pertes/') || h.startsWith('#/rapport/') ? '#/missions' : h.startsWith('#/ref/') ? '#/referentiel' : '#/');
  window.scrollTo(0, 0);
  try { if (h === '#/' || !a) home(); else if (a === 'nouvelle') await form(); else if (a === 'missions') await list(); else if (a === 'mission') await view(id); else if (a === 'edit') await form(id); else if (a === 'referentiel') await refList(); else if (a === 'ref') await refForm(id); else if (a === 'pertes') await pertes(id); else if (a === 'rapport') await rapport(id); else if (a === 'tableau') await tableau(); else if (a === 'parametres') await settings(); else home(); }
  catch (e) { app.innerHTML = `<div class="pad"><p>Une erreur est survenue : ${esc(e.message)}</p><a class="btn" href="#/">Accueil</a></div>`; }
}
